[delayed_gcode LED_OFF]
gcode:
    SET_PIN PIN=caselight VALUE=0
  {action_call_remote_method(
    "set_device_power", device="All_Lights", state="off"
  )}

[gcode_macro OFF]
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0   ; turn exhaust fan off
    SET_PIN PIN=caselight VALUE=0       ; turn case light off
    
[delayed_gcode OFF]
initial_duration:0.2
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0   ; turn exhaust fan off
    SET_PIN PIN=caselight VALUE=0       ; turn case light off

[gcode_macro M300]
gcode:  
    {% set S = params.S|default(1000)|int %} ; S sets the tone frequency
    {% set P = params.P|default(100)|int %} ; P sets the tone duration
    {% set L = 0.5 %} ; L varies the PWM on time, close to 0 or 1 the tone gets a bit quieter. 0.5 is a symmetric waveform
    {% if S <= 0 %} ; dont divide through zero
        {% set F = 1 %}
        {% set L = 0 %}
    {% elif S >= 10000 %} ;max frequency set to 10kHz
        {% set F = 0 %}
    {% else %}
        {% set F = 1/S %} ;convert frequency to seconds 
    {% endif %}
    SET_PIN PIN=beeper VALUE={L} CYCLE_TIME={F} ;Play tone
    G4 P{P} ;tone duration
    SET_PIN PIN=beeper VALUE=0

[gcode_macro beeper_tones]
description: Beep tones.
gcode:
    M300 S440 P200
    M300 S660 P250
    M300 S880 P300
    
[gcode_macro set_spool]
description: Spoolman Set Active Spool
gcode:
  {% set id = params.ID|int %}
  {action_call_remote_method(
      "spoolman_set_active_spool",
       spool_id=id
  )}

[gcode_macro LOG_Z]
gcode:
    {% set z_pos = printer.gcode_move.gcode_position.z %}
    RESPOND MSG="Current Z is {z_pos}"
    SAVE_VARIABLE VARIABLE=power_resume_z VALUE={z_pos}