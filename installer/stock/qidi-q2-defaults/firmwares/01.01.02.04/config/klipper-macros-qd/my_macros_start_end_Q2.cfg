[gcode_macro PRINT_START]
gcode:    
    SET_PRINT_MAIN_STATUS MAIN_STATUS=print_start
    
    {% set bedtemp = params.get('BED') | int %}
    {% set hotendtemp = params.get('HOTEND') | int %}
    {% set chambertemp = params.get('CHAMBER', 0) | int %}
    {% set extruder = params.EXTRUDER|default(0)|int %}
    {% set Polar_cooler = printer.save_variables.variables.enable_polar_cooler|default(0) %}

    M117
    LED_ON
    beep
    AUTOTUNE_SHAPERS
    DISABLE_ALL_SENSOR
    CLEAR_PAUSE

    M104 S{hotendtemp}       ; Set hotend temp (no wait)
    M140 S{bedtemp}          ; Set bed temp (no wait)
    M141 S{chambertemp}      ; Set chamber temp (no wait)
    {% if chambertemp == 0 %}
        M106 P3 S255
    {% endif %}
    SET_PRINT_SUB_STATUS SUB_STATUS=tool_head_reset
     
    G28
    SET_GCODE_OFFSET Z=0 MOVE=0
    BUFFER_MONITORING ENABLE=0
    SET_PRINT_SUB_STATUS SUB_STATUS=change_filament

    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] %} 
        SAVE_VARIABLE VARIABLE=load_retry_num VALUE=0
        SAVE_VARIABLE VARIABLE=retry_step VALUE=None
        CLEAR_TOOLCHANGE_STATE
        {% for i in range(16) %}
            SAVE_VARIABLE VARIABLE=runout_{i} VALUE=0
            G4 P100
        {% endfor %}
        {% if printer.save_variables.variables.enable_box == 1 %}
            BOX_PRINT_START EXTRUDER={extruder} HOTENDTEMP={hotendtemp}
            M400
            SET_PRINT_SUB_STATUS SUB_STATUS=flush_filament
            EXTRUSION_AND_FLUSH HOTEND={hotendtemp}
        {% endif %}
    {% endif %}

    SET_PRINT_SUB_STATUS SUB_STATUS=clear_nozzle
    CLEAR_NOZZLE HOTEND={hotendtemp}
    M104 S140
    M400
    _CG28  
    SET_PRINT_SUB_STATUS SUB_STATUS=z_tilt_adjust
    Z_TILT_ADJUST
    

    M104 S140
    SET_PRINT_SUB_STATUS SUB_STATUS=wait_bed_temp
    M190 S{bedtemp}   
    SET_PRINT_SUB_STATUS SUB_STATUS=wait_chamber_temp
    M191 S{chambertemp}
    M400
    
    LED_ON
    SET_PRINT_SUB_STATUS SUB_STATUS=auto_bed_adjust
    G29
    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] and printer.save_variables.variables.enable_box == 1 %}
        BUFFER_MONITORING ENABLE=1 
    {% endif %}
    M191 S{chambertemp}
    M109 S{hotendtemp}
    M204 S10000

    set_zoffset
    ENABLE_ALL_SENSOR
    save_last_file
    LED_ON
    SET_PRINT_MAIN_STATUS MAIN_STATUS=printing

[gcode_macro PRINT_END]
gcode:
    MOVE_TO_TRASH
    M400
    save_zoffset
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    M106 P2 S0
    M106 P0 S0
    DISABLE_BOX_HEATER
    
    M104 S0
    M140 S0
    M141 S0

    M220 S100
    M221 S100
	
    DISABLE_ALL_SENSOR
    {% if printer.save_variables.variables.box_count >= 1 and printer.save_variables.variables.enable_box == 1 and printer["box_extras"]%}
        BUFFER_MONITORING ENABLE=0
    {% endif %}
#    SET_GCODE_OFFSET Z=0 MOVE=0

    M84
    BED_MESH_CLEAR
    G31
    CLEAR_LAST_FILE
    SONG_STARWARS_IMP
    # SDCARD_RESET_FILE
    UPDATE_DELAYED_GCODE ID=LED_OFF DURATION=600

