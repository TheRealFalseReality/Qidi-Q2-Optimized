# Electronics temperatures exposed through Moonraker and Fluidd.

[temperature_sensor AP_Board_SOC]
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp
min_temp: 0
max_temp: 100

[temperature_sensor Toolhead_MCU]
sensor_type: temperature_mcu
sensor_mcu: THR
min_temp: 0
max_temp: 100

# The mainboard physically uses a GD32F425. QIDI compiles its Klipper MCU
# firmware with the pin-compatible stm32f407xx target, so Klipper reports STM32
# and its standard temperature_mcu code incorrectly reads STM32 calibration
# addresses. Use the GD32F425 datasheet's typical curve below.

[adc_temperature GD32F425]
temperature1: 0
voltage1: 1.5100
temperature2: 100
voltage2: 1.0700

[temperature_sensor Mainboard_MCU]
sensor_type: GD32F425
sensor_pin: ADC_TEMPERATURE
adc_voltage: 3.3
# Observational only: broad bounds prevent this sensor acting as
# a machine shutdown control during normal operation.
min_temp: -100
max_temp: 500
